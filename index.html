<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover 是为了适配手机的「刘海屏 / 挖孔屏」，
         让页面能延伸到屏幕边缘，配合 CSS 里的 safe-area 使用。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>学习中枢</title>

    <!-- 这一行让手机浏览器知道「这个网站可以被安装成 App」 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />

    <!-- 禁止手机浏览器自动识别电话号码，避免译文里的数字被变成蓝色链接 -->
    <meta name="format-detection" content="telephone=no" />
    <script type="module" crossorigin src="./assets/index-3-KZhsJF.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cftzseyw.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
